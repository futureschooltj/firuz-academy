name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install packages
        run: npm install --no-audit --no-fund

      - name: Build web app
        run: |
          mkdir -p www
          cp "$(ls index*.html | head -n 1)" www/index.html
          cp manifest*.json www/manifest.json
          cp sw*.js www/sw.js
          npx esbuild main.js --bundle --minify --format=iife --platform=browser --external:fs --outfile=www/bundle.js

      - name: Publish web version (GitHub Pages branch)
        run: |
          pip install pillow
          python3 "$(ls make_icons*.py | head -n 1)" "" www 2>/dev/null || python3 -c "print('icons later')"
          touch www/.nojekyll
          cd www
          git init -q -b gh-pages
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -q -m "web build ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages

      - name: Create Android project
        run: |
          npx cap add android
          pip install pillow
          python3 "$(ls make_icons*.py | head -n 1)" android/app/src/main/res www
          npx cap sync android
          F=$(find android/app/src/main/java -name MainActivity.java | head -n 1); sed -i 's/extends BridgeActivity {}/extends BridgeActivity { @Override public void onCreate(android.os.Bundle b) { getWindow().setFlags(android.view.WindowManager.LayoutParams.FLAG_SECURE, android.view.WindowManager.LayoutParams.FLAG_SECURE); super.onCreate(b); } }/' "$F"; grep -q FLAG_SECURE "$F"

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk FiruzAcademy.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FiruzAcademy-apk
          path: FiruzAcademy.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ github.run_number }}" FiruzAcademy.apk \
            --title "Firuz-Academy v${{ github.run_number }}" \
            --notes "APK барои насб дар Android"
