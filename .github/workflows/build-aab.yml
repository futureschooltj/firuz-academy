name: Build AAB (Google Play)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install packages
        run: npm install --no-audit --no-fund

      - name: Build web app
        run: |
          mkdir -p www
          cp "$(ls index*.html | head -n 1)" www/index.html
          cp manifest*.json www/manifest.json
          cp sw*.js www/sw.js
          cp privacy.html delete-account.html www/ 2>/dev/null || true
          npx esbuild main.js --bundle --minify --format=iife --platform=browser --external:fs --outfile=www/bundle.js
          echo 'window.FA_PLAY=true' > www/mode.js

      - name: Create Android project
        run: |
          printf '%s' '{"appId":"tj.firuzacademy.app","appName":"Firuz-Academy","webDir":"www","server":{"androidScheme":"https"}}' > capacitor.config.json
          npx cap add android
          pip install pillow
          python3 "$(ls make_icons*.py | head -n 1)" android/app/src/main/res www
          npx cap sync android
          F=$(find android/app/src/main/java -name MainActivity.java | head -n 1); sed -i 's/extends BridgeActivity {}/extends BridgeActivity { @Override public void onCreate(android.os.Bundle b) { getWindow().setFlags(android.view.WindowManager.LayoutParams.FLAG_SECURE, android.view.WindowManager.LayoutParams.FLAG_SECURE); super.onCreate(b); } }/' "$F"; grep -q FLAG_SECURE "$F"

      - name: Prepare release signing
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          RUN: ${{ github.run_number }}
        run: |
          test -n "$KS_B64"
          echo "$KS_B64" | base64 -d > android/app/release.keystore
          python3 - <<'PY'
          import re,os
          p='android/app/build.gradle'
          s=open(p).read()
          run=os.environ['RUN']
          sc='''
              signingConfigs {
                  release {
                      storeFile file("release.keystore")
                      storePassword System.getenv("KS_PASS")
                      keyAlias System.getenv("KS_ALIAS")
                      keyPassword System.getenv("KEY_PASS")
                  }
              }
          '''
          s=s.replace('android {','android {'+sc,1)
          s,n=re.subn(r'(buildTypes\s*\{\s*release\s*\{)',r'\1\n            signingConfig signingConfigs.release',s,1)
          assert n==1,'release block not found'
          s=re.sub(r'versionCode\s+\d+','versionCode '+run,s,1)
          s=re.sub(r'versionName\s+"[^"]*"','versionName "1.0.'+run+'"',s,1)
          open(p,'w').write(s)
          PY

      - name: Build signed AAB
        working-directory: android
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon

      - name: Show signature
        run: |
          keytool -printcert -jarfile android/app/build/outputs/bundle/release/app-release.aab | head -8 || true

      - uses: actions/upload-artifact@v4
        with:
          name: FiruzAcademy-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
