<!DOCTYPE html>
<html lang="tg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1546C9">

<link rel="manifest" href="manifest.json">
<title>Firuz-Academy</title>
<script src="bundle.js"></script>
<style>
:root{
  --bg:#F3F6FC;--card:#FFFFFF;--ink:#0E1B3D;--mut:#5C6A8C;--line:#E4E9F5;
  --pri:#1457D6;--pri-ink:#FFFFFF;--pri-soft:#E7F0FF;--acc:#FF9F1C;--acc-ink:#3A1E00;
  --ok:#0F8A4B;--ok-soft:#DDF5E7;--warn:#9A5B00;--warn-soft:#FFF0D2;--bad:#C62F2F;--bad-soft:#FDE3E3;
  --shadow:0 2px 6px rgba(10,47,126,.05),0 12px 28px rgba(10,47,126,.08);
  --r:22px;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0B1020;--card:#151B33;--ink:#EBEEFB;--mut:#9AA3C7;--line:#262E4D;
    --pri:#7C9BFF;--pri-ink:#0B1020;--pri-soft:#212A55;--acc:#FFA64D;--acc-ink:#2B1700;
    --ok:#4ADE97;--ok-soft:#14352A;--warn:#FFC25A;--warn-soft:#3B2D10;--bad:#FF8585;--bad-soft:#41191B;--shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#0B1020;--card:#151B33;--ink:#EBEEFB;--mut:#9AA3C7;--line:#262E4D;
  --pri:#7C9BFF;--pri-ink:#0B1020;--pri-soft:#212A55;--acc:#FFA64D;--acc-ink:#2B1700;
  --ok:#4ADE97;--ok-soft:#14352A;--warn:#FFC25A;--warn-soft:#3B2D10;--bad:#FF8585;--bad-soft:#41191B;--shadow:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",Arial,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.2}
a{color:var(--pri)}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--pri);color:var(--pri-ink);display:flex;align-items:center;gap:10px;padding:10px 14px;min-height:58px}
:root[data-theme="dark"] .top{background:var(--card);color:var(--ink);border-bottom:1px solid var(--line)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .top{background:var(--card);color:var(--ink);border-bottom:1px solid var(--line)}}
.top .logo{width:36px;height:36px;border-radius:10px;background:#fff;display:grid;place-items:center;overflow:hidden;flex:none}
.top h1{font-size:18px;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:44px;height:44px;border:0;background:transparent;color:inherit;border-radius:12px;display:grid;place-items:center;cursor:pointer;position:relative;flex:none}
.ib:active{background:rgba(127,127,127,.2)}
.ib svg{width:24px;height:24px}
main{padding:14px 14px 96px;max-width:980px;margin:0 auto}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);display:flex;padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px))}
.nav button{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;font-size:11.5px;color:var(--mut);cursor:pointer;border-radius:12px;position:relative;min-height:52px}
.nav button svg{width:24px;height:24px}
.nav button.on{color:var(--pri);font-weight:700}
.nav button.on::before{content:"";position:absolute;top:0;width:28px;height:3px;border-radius:2px;background:var(--pri)}
.dot{position:absolute;top:2px;right:calc(50% - 22px);min-width:18px;height:18px;border-radius:9px;background:var(--acc);color:var(--acc-ink);font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;margin-bottom:12px;border:1px solid var(--line)}
.card.tap{cursor:pointer}.card.tap:active{background:var(--pri-soft)}
.row{display:flex;align-items:center;gap:10px}.row.sp{justify-content:space-between}.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}.mut{color:var(--mut)}.sm{font-size:13.5px}.xs{font-size:12px}.b{font-weight:700}
.h2{font-size:20px;font-weight:700;margin:4px 0 10px}.h3{font-size:16px;font-weight:700;margin:16px 0 8px}
.gap{height:10px}.tc{text-align:center}
.empty{padding:26px 10px;text-align:center;color:var(--mut)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:99px;font-size:12.5px;font-weight:600;background:var(--pri-soft);color:var(--pri);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}.chip.warn{background:var(--warn-soft);color:var(--warn)}.chip.bad{background:var(--bad-soft);color:var(--bad)}.chip.gray{background:var(--line);color:var(--mut)}.chip.acc{background:var(--acc);color:var(--acc-ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:13px;border:0;background:var(--pri);color:var(--pri-ink);font-weight:700;cursor:pointer;font-size:16px;text-decoration:none}
.btn:active{filter:brightness(.9)}
.btn.sec{background:var(--pri-soft);color:var(--pri)}.btn.ghost{background:transparent;color:var(--pri);border:1.5px solid var(--line)}.btn.bad{background:var(--bad);color:#fff}.btn.acc{background:var(--acc);color:var(--acc-ink)}.btn.ok{background:var(--ok);color:#fff}
.btn.sm2{min-height:38px;padding:0 12px;font-size:14px;border-radius:10px}.btn.full{width:100%}
.btn[disabled]{opacity:.5;pointer-events:none}
.btn svg{width:20px;height:20px}
.fab{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:15;width:56px;height:56px;border-radius:18px;background:var(--acc);color:var(--acc-ink);border:0;box-shadow:0 6px 18px rgba(0,0,0,.25);display:grid;place-items:center;cursor:pointer}
.fab svg{width:28px;height:28px}
label.f{display:block;margin:0 0 12px;font-size:13.5px;font-weight:600;color:var(--mut)}
label.f>span{display:block;margin-bottom:5px}
input[type=text],input[type=password],input[type=date],input[type=month],input[type=time],input[type=number],input[type=tel],input[type=url],input[type=search],select,textarea{width:100%;min-height:48px;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font-size:16px}
textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--pri);outline:none}
.seg{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;border:1.5px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:99px;font-weight:600;font-size:14px;cursor:pointer;min-height:40px}
.seg button.on{background:var(--pri);border-color:var(--pri);color:var(--pri-ink)}
.search{position:relative;margin-bottom:10px}.search svg{position:absolute;left:12px;top:12px;width:24px;height:24px;color:var(--mut)}.search input{padding-left:44px}
.hero{background:linear-gradient(135deg,var(--pri),#2F7BFF);color:#fff;border-radius:20px;padding:18px;margin-bottom:12px}
:root[data-theme="dark"] .hero{background:linear-gradient(135deg,#213079,#2B4BB5)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .hero{background:linear-gradient(135deg,#213079,#2B4BB5)}}
.hero .big{font-size:22px;font-weight:800;margin:2px 0}
.secs{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
@media (min-width:640px){.secs{grid-template-columns:repeat(3,1fr)}}
@media (min-width:900px){.secs{grid-template-columns:repeat(4,1fr)}}
.sec{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px;text-align:left;cursor:pointer;min-height:104px;box-shadow:var(--shadow);position:relative}
.sec:active{background:var(--pri-soft)}
.sec .ti{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--pri-soft);color:var(--pri)}
.sec .ti svg{width:26px;height:26px}
.sec b{font-size:14.5px;line-height:1.25}
.sec .st{position:absolute;top:10px;right:10px}
.hs{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none}.hs::-webkit-scrollbar{display:none}
.hs .cc{flex:none;width:230px}
.cc{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;cursor:pointer;box-shadow:var(--shadow)}
.cc:active{background:var(--pri-soft)}
.cc .ti{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--pri-soft);color:var(--pri);flex:none}
.cc .ti svg{width:24px;height:24px}
.stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center;min-width:90px}
.stat b{display:block;font-size:22px}.stat span{font-size:12px;color:var(--mut)}
.bar{height:8px;border-radius:5px;background:var(--line);overflow:hidden}.bar>i{display:block;height:100%;background:var(--pri);border-radius:5px}
.bar.ok>i{background:var(--ok)}
.li{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.li:last-child{border-bottom:0}
.av{width:40px;height:40px;border-radius:50%;background:var(--pri-soft);color:var(--pri);display:grid;place-items:center;font-weight:800;flex:none}
.av svg{width:22px;height:22px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:0 -14px 12px;padding:0 10px;overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;border:0;background:transparent;padding:12px 12px;font-weight:600;color:var(--mut);cursor:pointer;border-bottom:3px solid transparent;font-size:15px}
.tabs button.on{color:var(--pri);border-bottom-color:var(--pri)}
.banner{border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:14px;font-weight:600}
.banner.warn{background:var(--warn-soft);color:var(--warn)}.banner.bad{background:var(--bad-soft);color:var(--bad)}.banner.ok{background:var(--ok-soft);color:var(--ok)}
.vid{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:14px;overflow:hidden;margin-bottom:12px}
.vid iframe,.vid video{position:absolute;inset:0;width:100%;height:100%;border:0}
.vid .shield{position:absolute;left:0;right:0;top:0;height:22%;z-index:2}
.doc{width:100%;height:70vh;border:1px solid var(--line);border-radius:12px;background:#fff}
.qimg{display:block;max-width:100%;max-height:340px;margin:0 auto 12px;border-radius:12px;border:1px solid var(--line);background:#fff;object-fit:contain}.tmsel{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.tmsel button{border:1.5px solid var(--line);background:var(--card);color:inherit;border-radius:999px;padding:8px 14px;font:700 14px inherit;cursor:pointer}.tmsel button.on{background:var(--pri,#1546C9);border-color:var(--pri,#1546C9);color:var(--pri-ink,#fff)}.tmsel input{width:104px;border:1.5px solid var(--line);border-radius:999px;padding:8px 12px;font:700 14px inherit;background:var(--card);color:inherit}.tmr{position:sticky;top:60px;z-index:20;margin:0 0 10px;padding:10px 14px;border-radius:14px;background:var(--card);border:1.5px solid var(--line);display:flex;justify-content:space-between;align-items:center;font-weight:800;box-shadow:0 4px 14px rgba(0,0,0,.08)}.tmr b{font-size:22px;font-variant-numeric:tabular-nums}.tmr.low{border-color:#e11d48;color:#e11d48}.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;margin-bottom:6px;cursor:pointer;background:var(--card)}
.opt input{width:20px;height:20px;flex:none;margin-top:2px}
.opt.on{border-color:var(--pri);background:var(--pri-soft)}.opt.good{border-color:var(--ok);background:var(--ok-soft)}.opt.badc{border-color:var(--bad);background:var(--bad-soft)}
.formula{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:17px;font-weight:700;background:var(--pri-soft);color:var(--pri);padding:8px 12px;border-radius:10px;display:inline-block;margin-bottom:4px}
.lock{display:grid;place-items:center;text-align:center;padding:18px 10px}
.lock svg{width:44px;height:44px;color:var(--acc)}
.tblw{overflow-x:auto;max-width:100%;border:1px solid var(--line);border-radius:12px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:13.5px}th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}th{background:var(--pri-soft);color:var(--pri)}
#modal{position:fixed;inset:0;z-index:50;display:none;background:rgba(10,12,30,.55);align-items:flex-end;justify-content:center}
#modal.open{display:flex}
.sheet{background:var(--card);width:100%;max-width:640px;max-height:94%;border-radius:22px 22px 0 0;display:flex;flex-direction:column;box-shadow:0 -8px 30px rgba(0,0,0,.3)}
.sheet .sh{display:flex;align-items:center;gap:8px;padding:12px 8px 8px 18px;border-bottom:1px solid var(--line)}
.sheet .sh h2{flex:1;font-size:18px}
.sheet .sb{padding:16px 18px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet .sf{padding:10px 18px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex;gap:10px}
.sheet .sf .btn{flex:1}
@media (min-width:700px){#modal{align-items:center}.sheet{border-radius:22px}}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;z-index:70;font-weight:600;font-size:14.5px;max-width:90%;display:none;text-align:center}
#toast.on{display:block}
.login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;max-width:420px;margin:0 auto;padding:24px 20px}
.login .lg{width:84px;height:84px;border-radius:24px;background:#fff;margin:0 auto 14px;display:grid;place-items:center;box-shadow:var(--shadow);overflow:hidden}
.login h1{text-align:center;font-size:26px;margin-bottom:4px}
.login p{text-align:center;margin:0 0 22px;color:var(--mut)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}}
/* REDESIGN: рангҳои логотип (кабуди торик ва равшан) */

@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) body{background:radial-gradient(900px 380px at 100% -80px,#DCE8FF 0,transparent 70%),radial-gradient(700px 320px at -10% 120px,#E8F1FF 0,transparent 70%),var(--bg);background-attachment:fixed}}
:root[data-theme="light"] body{background:radial-gradient(900px 380px at 100% -80px,#DCE8FF 0,transparent 70%),radial-gradient(700px 320px at -10% 120px,#E8F1FF 0,transparent 70%),var(--bg);background-attachment:fixed}
.top{background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:var(--ink);padding:12px 16px;min-height:64px}

.h3{font-size:18px;font-weight:800;margin:22px 0 10px;letter-spacing:-.2px}

.chip{padding:4px 11px}

.btn.bad{background:var(--bad);box-shadow:none}.btn.acc{background:var(--acc);box-shadow:none}

.login h1{font-size:30px;font-weight:800;letter-spacing:-.5px}

</head>

<script>
const DICT={
app:['Firuz-Academy','Firuz-Academy'],
tagline:['',''],
loginId:['ID (воридшавӣ)','ID (логин)'],password:['Парол','Пароль'],signin:['Ворид шудан','Войти'],
register:['Сохтани ҳисоби нав','Создать аккаунт'],haveAccount:['Ҳисоб дорам, ворид шудан','Уже есть аккаунт'],

const S={courses:{},bundles:{},ann:{},cfg:{},access:{},progress:{},results:{},orders:{},users:{},accessAll:{},resets:{},audit:{},items:{},sProg:{},sRes:{}};
let DB=null,AUTH=null,ME=null,authReady=false,needSetup=false,settingUp=false,waited=false,online=navigator.onLine;
const R={v:'home',p:null,tab:null,stack:[],filter:{}};
const isA=()=>!!ME&&ME.role==='admin';
const mySid=()=>ME?ME.sid:null;
window.addEventListener('online',()=>{online=true;render()});window.addEventListener('offline',()=>{online=false;render()});

const SUBS={};
function unsubAll(){Object.keys(SUBS).forEach(k=>{try{SUBS[k]()}catch(e){}delete SUBS[k]});Object.keys(S).forEach(k=>{S[k]=k==='cfg'?{}:{}})}
function sub(key,col,where,apply){
  if(SUBS[key])return;
  SUBS[key]=DB.collection(col,where).onSnapshot(snap=>{
    const o={};snap.docs.forEach(d=>{o[d.id]=Object.assign({id:d.id},d.data())});
    apply(o);
    if(key==='courses'||key==='access')syncItems();
    render();
  },err=>console.warn('sub',key,err&&err.code));
}
function startSubs(){
  sub('courses','courses',null,o=>{S.courses=o});
  sub('bundles','bundles',null,o=>{S.bundles=o});
  sub('ann','announcements',null,o=>{S.ann=o});
  sub('cfg','settings',null,o=>{S.cfg=o.main||{}});
  if(isA()){
    sub('users','users',null,o=>{S.users=o});
    sub('orders','group:orders',null,o=>{S.orders=o});
    sub('accessAll','group:access',null,o=>{S.accessAll=o});
    sub('resets','resets',null,o=>{S.resets=o});
    sub('audit','audit',null,o=>{S.audit=o});

async function W(op,col,id,data){

  const done=isDone(cid,it.id);const best=it.type==='test'?bestResult(cid,it.id):null;
  const meta=[t('ty_'+it.type),it.duration?it.duration+' '+t('min'):'',it.type==='test'&&it.questions?it.questions.length+' '+t('qs'):'',it.type==='test'&&it.timeLimit?'⏱ '+it.timeLimit+' '+t('min'):''].filter(Boolean).join(' · ');
  return `<div class="li" style="cursor:pointer" data-a="openItem" data-cid="${cid}" data-iid="${it.id}"><div class="av" style="${done?'background:var(--ok-soft);color:var(--ok)':''}">${done?ic('check'):ic(TYPE_IC[it.type])}</div><div class="grow"><div class="b">${esc(it.title)}</div><div class="xs mut">${esc(meta)}</div></div>${best!=null?chip(best+'%',best>=70?'ok':'warn'):''}${lvChip(it.level)}${isFav(cid,it.id)?`<span style="color:var(--acc)">${ic('star').replace('<svg','<svg style="width:18px;height:18px;fill:currentColor"')}</span>`:''}${isA()?`<button class="ib" data-a="itemForm" data-cid="${cid}" data-type="${it.type}" data-iid="${it.id}" aria-label="${esc(t('edit'))}">${ic('edit')}</button><button class="ib" data-a="itemDel" data-cid="${cid}" data-iid="${it.id}" aria-label="${esc(t('del'))}">${ic('trash')}</button>`:''}</div>`;
}
V.course=function(){
  const c=S.courses[R.p];if(!c)return empty();
  const acc=canAccess(c.id);const cnt=c.counts||{};
  let h=`<div class="card"><div class="row"><div class="av" style="width:52px;height:52px;border-radius:16px">${secIc(c.icon)}</div><div class="grow"><div class="b" style="font-size:19px">${esc(ct(c))}</div><div class="row wrap" style="margin-top:4px">${openedChip(c)}${c.discount&&!c.free?chip('−'+c.discount+'%','acc'):''}${c.active===false?chip(t('hidden'),'gray'):''}</div></div></div>${c.desc?`<div class="sm" style="margin-top:10px;white-space:pre-wrap">${esc(c.desc)}</div>`:''}
  <div class="row wrap" style="margin-top:10px"><span class="chip gray">${esc(t('ty_video'))}: ${cnt.video||0}</span><span class="chip gray">${esc(t('ty_book'))}: ${cnt.book||0}</span><span class="chip gray">${esc(t('ty_theory'))}: ${cnt.theory||0}</span><span class="chip gray">${esc(t('ty_test'))}: ${cnt.test||0}</span><span class="chip gray">${esc(t('ty_problem'))}: ${cnt.problem||0}</span></div>
  ${isA()?`<div class="row wrap" style="margin-top:12px"><button class="btn sec sm2" data-a="courseForm" data-id="${c.id}">${ic('edit')}${esc(t('edit'))}</button><button class="btn ghost sm2" data-a="courseDel" data-id="${c.id}">${ic('trash')}</button></div>`:''}</div>`;
  if(!acc){
    h+=`<div class="card lock">${ic('lock')}<div class="b" style="font-size:18px;margin:8px 0 4px">${esc(t('locked'+'Course'))}</div><div class="sm mut" style="margin-bottom:12px">${esc(t('lockedHint'))}</div><div class="b" style="font-size:24px;margin-bottom:12px">${c.discount?`<s class="mut sm">${money(c.price)}</s> `:''}${money(cPrice(c))}</div><button class="btn acc full" data-a="buy" data-kind="course" data-id="${c.id}">${ic('cart')}${esc(t('buyCourse'))}</button></div>`;
    const bs=vals(S.bundles).filter(b=>b.active!==false&&(b.courseIds||[]).includes(c.id));
    if(bs.length)h+=`<div class="h3">${esc(t('bundles'))}</div>`+bs.map(b=>`<div class="card tap" data-a="buy" data-kind="bundle" data-id="${b.id}"><div class="row sp"><div><div class="b">${esc(b.title)}</div><div class="xs mut">${(b.courseIds||[]).length} ${esc(t('coursesN'))}</div></div>${chip(money(bPrice(b)),'warn')}</div></div>`).join('');
    return h;
  }
  const all=itemsOf(c.id);
  const tabs=TYPES.filter(ty=>all.some(x=>x.type===ty)||isA());
  if(!all.length&&!isA())return h+empty(t('noContent'));
  const tab=tabs.includes(R.tab)?R.tab:(tabs[0]||'video');
  h+=`<div class="row sp"><span class="sm mut">${esc(t('progress'))}: <b>${coursePct(c.id)}%</b></span></div>${bar(coursePct(c.id))}<div class="gap"></div>`;
  h+=`<div class="tabs">${tabs.map(ty=>`<button data-a="tab" data-v="${ty}" class="${tab===ty?'on':''}">${esc(t('tb_'+ty))}</button>`).join('')}</div>`;
  const list=all.filter(x=>x.type===tab);
  h+=list.length?`<div class="card">${list.map(it=>itemRow(c.id,it)).join('')}</div>`:empty();
  if(isA())h+=`<button class="btn full" data-a="itemForm" data-cid="${c.id}" data-type="${tab}">${ic('plus')}${esc(t('addItem'))}: ${esc(t('ty_'+tab))}</button>`;
  return h;
};

/* ---- item viewer ---- */
let TST=null,PRB=null;
function siblings(cid,iid){const it=(S.items[cid]||{})[iid];const l=itemsOf(cid).filter(x=>x.type===it.type);const i=l.findIndex(x=>x.id===iid);return{prev:l[i-1],next:l[i+1]}}
V.item=function(){
  const {cid,iid}=R.p||{};const c=S.courses[cid];const it=(S.items[cid]||{})[iid];
  if(!c||!it||!canAccess(cid))return empty();
  const done=isDone(cid,iid),fav=isFav(cid,iid);
  let h=`<div class="card"><div class="row sp"><div class="grow"><div class="b" style="font-size:19px">${esc(it.title)}</div><div class="row wrap" style="margin-top:6px">${chip(t('ty_'+it.type),'')}${lvChip(it.level)}${it.duration?chip(it.duration+' '+t('min'),'gray'):''}${done?chip(t('done'),'ok'):''}</div></div></div>${it.desc?`<div class="sm" style="margin-top:10px;white-space:pre-wrap">${esc(it.desc)}</div>`:''}</div>`;
  if(it.type==='video'){
    const em=ytEmbed(it.url);
    if(!em)h+=`<div class="banner warn">${esc(t('noVideo'))}</div>`;
    else if(em.kind==='video')h+=`<div class="vid"><video controls playsinline preload="metadata" src="${esc(em.src)}" data-cid="${cid}" data-iid="${iid}"></video></div>`;
    else h+=`<div class="vid"><iframe src="${esc(em.src)}" allow="autoplay; fullscreen; picture-in-picture; encrypted-media" allowfullscreen ${/youtube|vimeo/.test(em.src)?'sandbox="allow-scripts allow-same-origin allow-presentation"':''} referrerpolicy="strict-origin-when-cross-origin" title="${esc(it.title)}"></iframe>${/youtube/.test(em.src)?'<div class="shield"></div>':''}</div>`;
    if(em&&em.kind==='iframe')h+=`<div class="xs mut" style="margin-bottom:8px">${esc(t('videoHint'))}</div>`;
  }else if(it.type==='book'){
    const em=ytEmbed(it.url);
    if(em&&em.src.includes('drive.google.com'))h+=`<iframe class="doc" src="${esc(em.src)}" title="${esc(it.title)}"></iframe>`;
    if(it.author)h+=`<div class="sm mut" style="margin:8px 0">${esc(t('author'))}: ${esc(it.author)}</div>`;
    if(it.url&&(it.allowDownload!==false||!(em&&em.src.includes('drive.google.com'))))h+=`<button class="btn sec full" data-a="openUrl" data-u="${esc(it.url)}">${ic('dl')}${esc(it.allowDownload===false?t('openBook'):t('downloadBook'))}</button>`;
    else if(!it.url)h+=`<div class="banner warn">${esc(t('noFile'))}</div>`;
  }else if(it.type==='theory'){
    h+=`<div class="card" style="white-space:pre-wrap">${esc(it.body||'')}</div>`;
    const fs=String(it.formulas||'').split('\n').map(x=>x.trim()).filter(Boolean);
    if(fs.length)h+=`<div class="h3">${esc(t('formulas'))}</div>`+fs.map(x=>{const p=x.split('|');return `<div class="card"><div class="formula">${esc(p[0].trim())}</div>${p[1]?`<div class="sm">${esc(p.slice(1).join('|').trim())}</div>`:''}</div>`}).join('');
    if(it.examples)h+=`<div class="h3">${esc(t('examples'))}</div><div class="card" style="white-space:pre-wrap">${esc(it.examples)}</div>`;
    if(it.units)h+=`<div class="h3">${esc(t('units'))}</div><div class="card" style="white-space:pre-wrap">${esc(it.units)}</div>`;
  }else if(it.type==='problem'){
    const key=cid+'/'+iid;if(!PRB||PRB.key!==key)PRB={key,shown:0};
    const steps=String(it.steps||'').split('\n').map(x=>x.trim()).filter(Boolean);
    h+=`<div class="card" style="white-space:pre-wrap">${esc(it.text||'')}</div>`;
    const fs=String(it.formulas||'').split('\n').map(x=>x.trim()).filter(Boolean);
    if(fs.length)h+=`<div class="h3">${esc(t('formulas'))}</div><div class="card">${fs.map(x=>`<div class="formula" style="margin:2px 6px 2px 0">${esc(x)}</div>`).join('')}</div>`;
    h+=`<div class="h3">${esc(t('solution'))}</div>`;
    h+=steps.slice(0,PRB.shown).map((s,i)=>`<div class="card"><div class="xs mut">${esc(t('step'))} ${i+1}</div><div style="white-space:pre-wrap">${esc(s)}</div></div>`).join('');
    if(PRB.shown<steps.length)h+=`<div class="row"><button class="btn sec grow" data-a="nextStep">${esc(t('nextStep'))}</button><button class="btn ghost" data-a="allSteps">${esc(t('showAll'))}</button></div>`;
    else if(it.answer)h+=`<div class="banner ok">${esc(t('answer'))}: ${esc(it.answer)}</div>`;
    if(it.explain)h+=`<div class="card sm" style="white-space:pre-wrap;margin-top:10px">${esc(it.explain)}</div>`;
  }else if(it.type==='test'){
    h+=testHtml(cid,iid,it);
  }
  if(it.type!=='test')h+=`<div class="row wrap" style="margin-top:12px"><button class="btn ${done?'ghost':'ok'} grow" data-a="toggleDone" data-cid="${cid}" data-iid="${iid}">${ic('check')}${esc(done?t('unmark'):t('markDone'))}</button><button class="btn ghost" data-a="toggleFav" data-cid="${cid}" data-iid="${iid}" aria-label="${esc(t('favorites'))}">${ic('star').replace('<svg','<svg style="'+(fav?'fill:var(--acc);color:var(--acc)':'')+'"')}</button></div>`;
  const sb=siblings(cid,iid);
  h+=`<div class="row" style="margin-top:12px">${sb.prev?`<button class="btn sec grow" data-a="openItem" data-cid="${cid}" data-iid="${sb.prev.id}" data-rep="1">‹ ${esc(t('prev'))}</button>`:'<span class="grow"></span>'}${sb.next?`<button class="btn sec grow" data-a="openItem" data-cid="${cid}" data-iid="${sb.next.id}" data-rep="1">${esc(t('next'))} ›</button>`:'<span class="grow"></span>'}</div>`;
  return h;
};
function fmtT(sec){sec=Math.max(0,sec);return String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')}
let TMR=null;
function tmrStop(){if(TMR){clearInterval(TMR);TMR=null}}
function tmrStart(cid,iid){
  tmrStop();
  TMR=setInterval(()=>{
    if(!TST||!TST.end||TST.sub||R.v!=='item'||!R.p||R.p.cid!==cid||R.p.iid!==iid){if(!TST||TST.sub||!TST.end||R.v!=='item'){tmrStop();if(TST&&!TST.sub){TST=null}}return}
    const left=Math.ceil((TST.end-Date.now())/1000);
    const el=document.getElementById('tmrv');if(el){el.textContent=fmtT(left);const bx=el.closest('.tmr');if(bx)bx.classList.toggle('low',left<=60)}
    if(left<=0){tmrStop();toast(t('timeUp'));ACT.testSubmit({cid,iid,force:'1'})}
  },500);
}
function testHtml(cid,iid,it){
  const key=cid+'/'+iid;if(!TST||TST.key!==key)TST={key,ans:{},sub:false,res:null,end:0,started:false};
  const qs=it.questions||[];const lim=+it.timeLimit||0;
  let h='';
  if(!TST.started&&!TST.sub&&!isA()){
    if(TST.sel==null)TST.sel=lim;
    const opts=[0,5,10,15,20,30,45,60];if(lim&&!opts.includes(lim))opts.push(lim);opts.sort((x,y)=>x-y);
    h+=`<div class="card"><div class="b">⏱ ${esc(t('chooseTime'))}</div><div class="tmsel">${opts.map(m=>`<button type="button" data-a="tmSel" data-m="${m}" class="${TST.sel===m?'on':''}">${m?m+' '+esc(t('min')):esc(t('noTime'))}</button>`).join('')}<input type="number" min="1" max="300" inputmode="numeric" placeholder="${esc(t('customMin'))}" data-c="tmCustom" value="${opts.includes(TST.sel)?'':TST.sel}"></div>${TST.sel>0?`<div class="sm mut" style="margin-bottom:10px">${esc(t('testInfo',{q:qs.length,m:TST.sel}))}. ${esc(t('testInfoHint'))}</div><button class="btn full" data-a="testStart" data-cid="${cid}" data-iid="${iid}">${esc(t('startTest'))}</button>`:''}</div>`;
    if(TST.sel>0)return h;
  }
  if(TST.started&&TST.end&&!TST.sub){const left=Math.ceil((TST.end-Date.now())/1000);h+=`<div class="tmr${left<=60?' low':''}"><span>⏱</span><b id="tmrv">${fmtT(left)}</b></div>`}
  if(TST.sub&&TST.res){const r=TST.res;h+=`<div class="card tc"><div style="font-size:34px;font-weight:800">${r.score}/${r.max}</div><div class="b ${r.pct>=70?'':'mut'}">${r.pct}%</div><div style="margin-top:6px">${chip(r.pct>=90?t('excellent'):r.pct>=70?t('good'):t('tryAgain'),r.pct>=70?'ok':'warn')}</div></div>`}
  h+=qs.map((q,qi)=>{
    const sel=TST.ans[qi];
    return `<div class="card"><div class="b" style="margin-bottom:8px">${qi+1}. ${esc(q.q)}</div>${q.img?`<img class="qimg" src="${esc(q.img)}" alt="">`:''}${(q.opts||[]).map((o,oi)=>{if(!o)return '';
      let cls='';if(TST.sub){if(oi===q.correct)cls='good';else if(oi===sel)cls='badc'}else if(sel===oi)cls='on';
      return `<div class="opt ${cls}" ${TST.sub?'':`data-a="pick" data-q="${qi}" data-o="${oi}"`}><b>${'ABCD'[oi]}</b><span>${esc(o)}</span></div>`}).join('')}${TST.sub&&q.explain?`<div class="sm mut" style="margin-top:6px">💡 ${esc(q.explain)}</div>`:''}</div>`}).join('');
  if(!qs.length)h+=empty();
  else if(!TST.sub)h+=`<button class="btn full" data-a="testSubmit" data-cid="${cid}" data-iid="${iid}">${esc(t('submitTest'))}</button>`;
  else h+=`<button class="btn full" data-a="testRetry">${ic('refresh')}${esc(t('retake'))}</button>`;
  const hist=sortBy(vals(S.results).filter(x=>x.courseId===cid&&x.itemId===iid),x=>-(x.ts||0)).slice(0,5);
  if(hist.length)h+=`<div class="h3">${esc(t('history'))}</div><div class="card">${hist.map(x=>`<div class="li"><div class="grow sm">${esc(fmtTs(x.ts))}</div><b>${x.score}/${x.max}</b>${chip(x.pct+'%',x.pct>=70?'ok':'warn')}</div>`).join('')}</div>`;
  return h;
}

/* ---- buy ---- */
V.buy=function(){
  const {kind,id}=R.p||{};const it=kind==='bundle'?S.bundles[id]:S.courses[id];if(!it)return empty();
  const title=kind==='bundle'?it.title:ct(it);const price=kind==='bundle'?bPrice(it):cPrice(it);const cfg=S.cfg;
  const o=orderOpen(kind,id);
  let h=`<div class="card"><div class="b" style="font-size:19px">${esc(title)}</div>`;
  if(kind==='course'){const n=it.counts||{};h+=`${it.desc?`<div class="sm" style="margin:8px 0;white-space:pre-wrap">${esc(it.desc)}</div>`:''}<div class="row wrap"><span class="chip gray">${esc(t('ty_video'))}: ${n.video||0}</span><span class="chip gray">${esc(t('ty_book'))}: ${n.book||0}</span><span class="chip gray">${esc(t('ty_test'))}: ${n.test||0}</span><span class="chip gray">${esc(t('ty_problem'))}: ${n.problem||0}</span></div>`}
  else h+=`<div class="sm" style="margin:8px 0">${(it.courseIds||[]).map(cid=>S.courses[cid]?'• '+esc(ct(S.courses[cid])):'').join('<br>')}</div>`;
  h+=`<div class="b" style="font-size:26px;margin-top:10px">${it.discount?`<s class="mut sm">${money(it.price)}</s> `:''}${money(price)}</div></div>`;
  if(o)h+=`<div class="card"><div class="row sp"><div><div class="xs mut">${esc(t('orderStatus'))}</div><div class="b">${esc(t('os_'+o.status))}</div></div>${chip(fmtTs(o.ts),'gray')}</div></div>`;
  h+=`<div class="card"><div class="b" style="margin-bottom:6px">${esc(t('howToBuy'))}</div><div class="sm">1. ${esc(t('hb1'))}<br>2. ${esc(t('hb2'))}<br>3. ${esc(t('hb3'))}<br>4. ${esc(t('hb4'))}</div></div>`;
  h+=`<button class="btn ok full" data-a="waBuy">${ic('chat')}${esc(t('waBtn'))}</button>`;
  if(cfg.walletNumber||cfg.walletName||cfg.instructions)h+=`<div class="card" style="margin-top:12px"><div class="b" style="margin-bottom:6px">${esc(t('payInfo'))}</div>${cfg.walletName?`<div class="sm"><span class="mut">${esc(t('walletName'))}:</span> <b>${esc(cfg.walletName)}</b></div>`:''}${cfg.walletNumber?`<div class="sm"><span class="mut">${esc(t('walletNumber'))}:</span> <b style="user-select:all">${esc(cfg.walletNumber)}</b></div>`:''}${cfg.walletOwner?`<div class="sm"><span class="mut">${esc(t('walletOwner'))}:</span> <b>${esc(cfg.walletOwner)}</b></div>`:''}${cfg.instructions?`<div class="sm" style="margin-top:6px;white-space:pre-wrap">${esc(cfg.instructions)}</div>`:''}</div>`;
  return h;
};
V.orders=function(){
  const os=sortBy(vals(S.orders).filter(o=>o.sid===mySid()),o=>-(o.ts||0));
  return os.length?os.map(o=>`<div class="card"><div class="row sp"><div class="b">${esc(o.title)}</div>${chip(t('os_'+o.status),o.status==='confirmed'?'ok':o.status==='rejected'?'bad':'warn')}</div><div class="sm mut" style="margin-top:4px">${money(o.price)} · ${esc(fmtTs(o.ts))}</div></div>`).join(''):empty();

/* ---- cabinet ---- */
V.cabinet=function(){
  const cs=visibleCourses();const acc=cs.filter(c=>canAccess(c.id));
  const bought=cs.filter(c=>!c.free&&canAccess(c.id));const locked=cs.filter(c=>!canAccess(c.id));
  let vTot=0,vDone=0;acc.forEach(c=>itemsOf(c.id).forEach(it=>{if(it.type==='video'){vTot++;if(isDone(c.id,it.id))vDone++}}));
  const best={};vals(S.results).forEach(r=>{const k=r.courseId+'/'+r.itemId;best[k]=Math.max(best[k]||0,r.pct)});
  const bs=Object.values(best);const avg=bs.length?Math.round(bs.reduce((a,b)=>a+b,0)/bs.length):null;
  let h=`<div class="card"><div class="row"><div class="av" style="width:56px;height:56px;font-size:20px">${esc(initials(ME.name))}</div><div class="grow"><div class="b" style="font-size:19px">${esc(ME.name)}</div><div class="sm mut">ID: ${esc(ME.login)}</div></div></div></div>
  <div class="row wrap" style="margin-bottom:12px"><div class="stat"><b>${bought.length}</b><span>${esc(t('boughtCourses'))}</span></div><div class="stat"><b>${vDone}/${vTot}</b><span>${esc(t('watchedVideos'))}</span></div><div class="stat"><b>${avg==null?'—':avg+'%'}</b><span>${esc(t('avgTests'))}</span></div></div>`;
  h+=`<div class="h3">${esc(t('availableCourses'))}</div>`+(acc.length?`<div class="card">${acc.map(c=>`<div class="li" style="cursor:pointer" data-a="go" data-v="course" data-p="${c.id}"><div class="av">${secIc(c.icon)}</div><div class="grow"><div class="b">${esc(ct(c))}</div>${itemsOf(c.id).length?bar(coursePct(c.id)):''}</div><b>${coursePct(c.id)}%</b></div>`).join('')}</div>`:empty());
  if(locked.length)h+=`<div class="h3">${esc(t('lockedCourses'))}</div><div class="card">${locked.map(c=>`<div class="li" style="cursor:pointer" data-a="go" data-v="course" data-p="${c.id}"><div class="av" style="color:var(--acc)">${ic('lock')}</div><div class="grow b">${esc(ct(c))}</div>${chip(money(cPrice(c)),'warn')}</div>`).join('')}</div>`;
  const rs=sortBy(vals(S.results),r=>-(r.ts||0)).slice(0,8);
  if(rs.length)h+=`<div class="h3">${esc(t('testResults'))}</div><div class="card">${rs.map(r=>{const it=(S.items[r.courseId]||{})[r.itemId];return `<div class="li"><div class="grow"><div class="b">${esc(it?it.title:'—')}</div><div class="xs mut">${esc(fmtTs(r.ts))}</div></div><b>${r.score}/${r.max}</b>${chip(r.pct+'%',r.pct>=70?'ok':'warn')}</div>`}).join('')}</div>`;
  const favs=[];acc.forEach(c=>itemsOf(c.id).forEach(it=>{if(isFav(c.id,it.id))favs.push({c,it})}));
  if(favs.length)h+=`<div class="h3">${esc(t('favorites'))}</div><div class="card">${favs.map(x=>`<div class="li" style="cursor:pointer" data-a="openItem" data-cid="${x.c.id}" data-iid="${x.it.id}"><div class="av">${ic(TYPE_IC[x.it.type])}</div><div class="grow b">${esc(x.it.title)}</div></div>`).join('')}</div>`;
  h+=`<div class="row wrap" style="margin-top:8px"><button class="btn sec grow" data-a="go" data-v="orders">${ic('cart')}${esc(t('myOrders'))}</button><button class="btn sec grow" data-a="go" data-v="ann">${ic('bell')}${esc(t('announcements'))}</button></div>`;
  return h;
};

/* ---- settings (shared) ---- */
V.settings=function(){
  const th=(()=>{try{return localStorage.getItem('pa_theme')||'auto'}catch(e){return 'auto'}})();

let rT=null,pendingR=false,forceNext=false;
function applyTheme(){
  let th='auto';try{th=localStorage.getItem('pa_theme')||'auto'}catch(e){}
  const r=document.documentElement;
  if(th==='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',th);
  r.lang=lang;
}
function textFocused(){
  const a=document.activeElement;if(!a||!$('#app').contains(a))return false;
  if(a.tagName==='TEXTAREA')return true;
  if(a.tagName==='INPUT')return ['text','search','password','tel','number','url','email'].includes(a.type);
  return false;
}
const videoPlaying=()=>{const v=document.querySelector('video');return !!(v&&!v.paused&&!v.ended)};
const embedOpen=()=>R.v==='item'&&!!document.querySelector('.vid iframe,.doc');
function render(force){if(force===true)forceNext=true;clearTimeout(rT);rT=setTimeout(doRender,30)}
function doRender(){
  const force=forceNext;forceNext=false;
  applyTheme();
  if(!force&&(textFocused()||videoPlaying()||embedOpen())){pendingR=true;return}
  pendingR=false;
  const box=inner=>`<div class="login"><div class="lg">${LOGO}</div><h1>${esc(t('app'))}</h1>${inner}</div>`;
  let html='';
  if(!window.FSX||!FSX.configured)html=box(`<div class="banner bad">${esc(t('cfgErr'))}</div>`);
  else if(!authReady)html=box(`<p>${esc(t('loading'))}</p>`);
  else if(!AUTH)html=loginScreen();
  else if(!ME)html=waited?box(`<div class="banner bad">${esc(t('noAccount'))}</div><button class="btn full" data-a="reload">${esc(t('retry'))}</button><div class="gap"></div><button class="btn ghost full" data-a="logout">${esc(t('logout'))}</button>`):box(`<p>${esc(t('loading'))}</p>`);
  else if(ME.mustChange)html=`<header class="top"><div class="logo">${LOGO}</div><h1>${esc(t('changePass'))}</h1><button class="ib" data-a="logout" aria-label="${esc(t('logout'))}">${ic('logout')}</button></header><main>${V.pw(true)}</main>`;
  else html=shell();
  $('#app').innerHTML=html;
  afterRender();
}
function afterRender(){
  const v=document.querySelector('video[data-cid]');
  if(v&&!v.__b){
    v.__b=1;const cid=v.dataset.cid,iid=v.dataset.iid;
    const pos=((S.progress[cid]||{}).pos||{})[iid];
    v.addEventListener('loadedmetadata',()=>{if(pos&&v.duration&&pos<v.duration-3)v.currentTime=pos},{once:true});
    let last=0;
    v.addEventListener('timeupdate',()=>{const n=Date.now();if(n-last>8000&&v.currentTime>1){last=n;saveProgress(cid,{pos:{[iid]:Math.floor(v.currentTime)}})}});
    v.addEventListener('pause',()=>{if(v.currentTime>1)saveProgress(cid,{pos:{[iid]:Math.floor(v.currentTime)}});render()});
    v.addEventListener('ended',()=>{markDone(cid,iid,true)});
  }
}
document.addEventListener('focusout',()=>{setTimeout(()=>{if(pendingR&&!textFocused())render()},60)});

function deepMerge(a,b){for(const k in b){if(b[k]&&typeof b[k]==='object'&&!Array.isArray(b[k])&&a[k]&&typeof a[k]==='object')deepMerge(a[k],b[k]);else a[k]=b[k]}return a}
function saveProgress(cid,data){
  if(isA()||!ME)return Promise.resolve();
  S.progress[cid]=deepMerge(S.progress[cid]||{},clone(data));
  return W('update','students/'+mySid()+'/progress',cid,Object.assign({sid:mySid(),courseId:cid},data));
}
async function markDone(cid,iid,val){
  if(isA()){toast(t('adminNoProgress'));return}
  await saveProgress(cid,{done:{[iid]:val}});render(true);
}
function keepFocusRender(sel,html){
  const v=$('#view');v.innerHTML=html;const n=$(sel);
  if(n){n.focus();try{const l=n.value.length;n.setSelectionRange(l,l)}catch(e){}}
}

document.addEventListener('submit',e=>{const f=e.target.closest('[data-f]');if(!f)return;e.preventDefault();const h=FORM[f.dataset.f];if(h)Promise.resolve(h(new FormData(f),f)).catch(err=>console.error(err))});
document.addEventListener('change',e=>{const el=e.target.closest('[data-c]');if(!el)return;const h=CHG[el.dataset.c];if(h)Promise.resolve(h(el.value,el)).catch(err=>console.error(err))});
document.addEventListener('input',e=>{const el=e.target.closest('[data-i]');if(!el)return;const h=INP[el.dataset.i];if(h)h(el.value,el)});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal'&&!$('#modal').querySelector('[data-a=cfYes]'))closeModal()});

ACT.testSubmit=async d=>{

FORM.login=async fd=>{await doLogin(fd.get('login'),String(fd.get('pw')||''))};
async function bootstrapAccount(role,fd,isFirst){
  const login=String(fd.get('login')).trim();const pw=String(fd.get('pw'));const name=String(fd.get('name')).trim();
  const key=loginKey(login);
  if(pw.length<8){toast(t('passShort'));return}
  if(!key||!name){toast(t('required'));return}
  settingUp=true;
  try{
    if(!isFirst){const ex=await FSX.getDoc('logins',key);if(ex){settingUp=false;toast(t('loginTaken'));return}}
    let u;
    try{u=await FSX.signUp(emailFor(key,0),pw)}
    catch(e){if(isFirst&&e&&e.code==='auth/email-already-in-use')u=await FSX.signInEmail(emailFor(key,0),pw);else throw e}
    await FSX.db.collection('users').doc(u.uid).set({role,active:true,sid:u.uid,login,name,phone:String(fd.get('phone')||'').trim(),created:Date.now(),mustChange:false});
    await FSX.db.collection('logins').doc(key).set({email:emailFor(key,0),uid:u.uid,sid:u.uid});
    if(isFirst)await FSX.db.collection('config').doc('init').set({done:true,ts:Date.now()});
    needSetup=false;settingUp=false;R.filter.reg=false;
    await onAuthChanged(u);
  }catch(e){
    settingUp=false;console.warn(e);
    toast(e&&e.code==='auth/email-already-in-use'?t('loginTaken'):e&&e.code==='auth/weak-password'?t('passShort'):t('setupFail'));
    try{await FSX.signOut()}catch(_){}
  }
}
FORM.first=fd=>bootstrapAccount('admin',fd,true);
FORM.register=fd=>bootstrapAccount('student',fd,false);
FORM.pw=async fd=>{
  const cur=String(fd.get('cur')),n1=String(fd.get('n1')),n2=String(fd.get('n2'));
  if(n1.length<8){toast(t('passShort'));return}
  if(n1!==n2){toast(t('passMismatch'));return}
  try{await FSX.changePassword(cur,n1)}
  catch(e){const c=e&&e.code;toast(c==='auth/wrong-password'||c==='auth/invalid-credential'?t('wrongCur'):t('saveFail'));return}
  const r=await W('update','users',ME.uid,{mustChange:false});
  if(r!==null){ME.mustChange=false;toast(t('passChanged'));if(R.stack.length)goBack();else render(true)}
};
ACT.forgot=()=>openModal(t('forgot'),`<form id="mf" data-f="forgot">${fld(t('loginId'),`<input type="text" name="login" required autocapitalize="off">`)}</form>`,`<button class="btn" type="submit" form="mf">${esc(t('send'))}</button>`);
FORM.forgot=async fd=>{
  const login=String(fd.get('login')).trim();const id=loginKey(login)||uid();
  const r=await W('set','resets',id,{login,ts:Date.now(),done:false});
  if(r!==null){closeModal();toast(t('forgotSent'))}
};
async function newAuthAccount(key,startV,pw){
  for(let v=startV;v<startV+8;v++){
    const email=emailFor(key,v);
    try{const u=await FSX.createAccount(email,pw);return{uid:u,email,v}}
    catch(e){if(e&&e.code==='auth/email-already-in-use')continue;throw e}
  }
  throw {code:'too-many'};
}
const authErr=e=>{const c=e&&e.code;return c==='auth/network-request-failed'?t('offline'):c==='auth/weak-password'?t('passShort'):t('saveFail')};

let resetReqId=null;
FORM.student=async fd=>{
  const uidOld=fd.get('uid');const login=String(fd.get('login')).trim();const name=String(fd.get('name')).trim();
  const phone=String(fd.get('phone')||'').trim();const pw=String(fd.get('pw')||'');const key=loginKey(login);
  if(!login||!name){toast(t('required'));return}
  if(!uidOld&&vals(S.users).some(u=>loginKey(u.login)===key)){toast(t('loginTaken'));return}
  let shown=null;
  if(!uidOld){
    if(pw.length<8){toast(t('passShort'));return}
    let acc;try{acc=await newAuthAccount(key,0,pw)}catch(e){toast(authErr(e));return}
    const sid=uid();
    if(null===await W('set','users',acc.uid,{role:'student',active:true,sid,login,name,phone,created:Date.now(),mustChange:true,v:acc.v}))return;
    if(null===await W('set','logins',key,{email:acc.email,uid:acc.uid,sid}))return;
    await audit('student_add',{sid,name});shown=pw;
  }else{
    const old=clone(S.users[uidOld]||{});
    if(pw){
      if(pw.length<8){toast(t('passShort'));return}
      let acc;try{acc=await newAuthAccount(key,(old.v||0)+1,pw)}catch(e){toast(authErr(e));return}
      if(null===await W('set','users',acc.uid,Object.assign(old,{name,phone,mustChange:true,v:acc.v})))return;
      await W('delete','users',uidOld);
      await W('set','logins',key,{email:acc.email,uid:acc.uid,sid:old.sid});
      await audit('pw_reset',{sid:old.sid,name});shown=pw;
    }else{
      if(null===await W('update','users',uidOld,{name,phone}))return;
    }
  }
  if(resetReqId){await W('update','resets',resetReqId,{done:true});resetReqId=null}
  closeModal();
  if(shown)openModal(t('passCopy'),`<div class="card"><div class="sm mut">${esc(t('loginId'))}</div><div class="b" style="font-size:20px">${esc(login)}</div><div class="sm mut" style="margin-top:10px">${esc(t('tempPass'))}</div><div class="b" style="font-size:22px;letter-spacing:1px;user-select:all">${esc(shown)}</div></div><div class="banner warn">${esc(t('passNote'))}</div>`,`<button class="btn" data-a="closeModal">${esc(t('ok'))}</button>`);
  else toast(t('saved'));
};

const findOrder=(sid,oid)=>vals(S.orders).find(o=>o.sid===sid&&(o.oid===oid||o.id===oid));
const orderCourses=o=>o.kind==='bundle'?((S.bundles[o.refId]||{}).courseIds||[]):[o.refId];
async function grantCourse(sid,cid,orderId){
  const u=userBySid(sid);
  const r=await W('set','students/'+sid+'/access',cid,{sid,courseId:cid,active:true,ts:Date.now(),by:ME.login,orderId:orderId||''});
  if(r!==null){S.accessAll['students/'+sid+'/access/'+cid]={sid,courseId:cid,active:true};await audit('grant',{sid,name:u?u.name:'',courseId:cid,orderId:orderId||''})}
  return r;
}
async function revokeCourse(sid,cid){
  const u=userBySid(sid);
  const r=await W('update','students/'+sid+'/access',cid,{active:false,revokedTs:Date.now()});
  if(r!==null){S.accessAll['students/'+sid+'/access/'+cid]={sid,courseId:cid,active:false};await audit('revoke',{sid,name:u?u.name:'',courseId:cid})}
  return r;
}

ACT.revoke=async d=>{if(await confirmBox(t('revokeConfirm'),t('revoke'))){await revokeCourse(d.sid,d.cid);render(true)}};
async function setStatus(o,status,action){
  const h=(o.history||[]).concat([{s:status,ts:Date.now(),by:ME.login}]);
  const r=await W('update','students/'+o.sid+'/orders',o.oid||o.id,{status,history:h});
  if(r!==null){o.status=status;o.history=h;await audit(action||'status',{sid:o.sid,name:o.name,orderId:o.oid||o.id,note:status});render(true)}
}
CHG.ordStatus=(v,el)=>{const o=findOrder(el.dataset.sid,el.dataset.oid);if(o)return setStatus(o,v)};
ACT.ordConfirm=d=>{const o=findOrder(d.sid,d.oid);if(o)return setStatus(o,'confirmed','confirm')};
ACT.ordReject=async d=>{const o=findOrder(d.sid,d.oid);if(o&&await confirmBox(t('rejectConfirm'),t('rejectPay')))return setStatus(o,'rejected','reject')};
ACT.ordGrant=async d=>{
  const o=findOrder(d.sid,d.oid);if(!o)return;
  if(o.status!=='confirmed'&&!await confirmBox(t('grantUnconfirmed'),t('grantAccess')))return;
  for(const cid of orderCourses(o))await grantCourse(o.sid,cid,o.oid||o.id);
  toast(t('saved'));render(true);
};
ACT.ordRevoke=async d=>{
  const o=findOrder(d.sid,d.oid);if(!o)return;
  if(!await confirmBox(t('revokeConfirm'),t('revoke')))return;
  for(const cid of orderCourses(o))await revokeCourse(o.sid,cid);
  render(true);
};

  if(type==='book'){doc.url=g('url');doc.author=g('author');doc.allowDownload=fd.get('allowDownload')==='on'}
  if(type==='theory'){doc.body=g('body');doc.formulas=g('formulas');doc.examples=g('examples');doc.units=g('units')}
  if(type==='problem'){doc.text=g('text');doc.formulas=g('formulas');doc.steps=g('steps');doc.answer=g('answer');doc.explain=g('explain')}
  if(!doc.title){toast(t('required'));return}
  const r=await W('set','courses/'+cid+'/items',iid,doc);
  if(r!==null){S.items[cid]=Object.assign(S.items[cid]||{},{[iid]:doc});await W('update','courses',cid,{counts:countsWith(cid,iid,type)});closeModal();toast(t('saved'))}
};
ACT.itemDel=async d=>{
  if(!await confirmBox(t('confirmDel'),t('del')))return;
  const c=countsWith(d.cid,d.iid,null);
  await W('delete','courses/'+d.cid+'/items',d.iid);await W('update','courses',d.cid,{counts:c});
};
/* test editor */
let qd=null;
function qBody(){
  const e=qd;
  return `<form id="mf" data-f="test">${fld(t('title'),`<input type="text" name="title" required value="${esc(e.title)}">`)}<div class="row"><label class="f grow"><span>${esc(t('level'))}</span><select name="level">${lvOpts(e.level)}</select></label><label class="f grow"><span>${esc(t('order'))}</span><input type="number" name="order" value="${+e.order||0}"></label></div>
  ${fld(t('timeLimit'),`<input type="number" name="tl" min="0" max="300" value="${+e.timeLimit||0}">`)}
  <div class="h3">${esc(t('tb_test'))}</div>${e.questions.map((q,i)=>`<div class="card"><div class="row sp"><b>${esc(t('question'))} ${i+1}</b>${e.questions.length>1?`<button type="button" class="btn ghost sm2" data-a="qDel" data-n="${i}">${ic('trash')}</button>`:''}</div><div class="gap"></div>
    <label class="f"><span>${esc(t('text'))}</span><textarea name="q${i}" rows="2">${esc(q.q)}</textarea></label>
    <div class="f"><span>${esc(t('qImage'))}</span>${q.img?`<img class="qimg" src="${esc(q.img)}" alt=""><button type="button" class="btn ghost sm2" data-a="qImgDel" data-n="${i}">${ic('trash')}${esc(t('delImage'))}</button>`:`<input type="file" accept="image/*" data-c="qImg" data-n="${i}">`}</div>
    ${[0,1,2,3].map(j=>`<div class="row" style="margin-bottom:8px"><input type="radio" name="c${i}" value="${j}" ${q.correct===j?'checked':''} aria-label="${esc(t('correct'))}" style="width:22px;height:22px;flex:none"><input type="text" name="o${i}_${j}" placeholder="${'ABCD'[j]}" value="${esc(q.opts[j]||'')}"></div>`).join('')}<div class="xs mut">● ${esc(t('correct'))}</div>
    <label class="f" style="margin-top:8px"><span>${esc(t('explainShort'))}</span><textarea name="e${i}" rows="2">${esc(q.explain||'')}</textarea></label></div>`).join('')}
  <button type="button" class="btn sec full" data-a="qAdd">${ic('plus')}${esc(t('addQuestion'))}</button></form>`;
}
function qSync(){
  const f=$('#mf');if(!f||!qd)return;const fd=new FormData(f);
  qd.title=String(fd.get('title')||'');qd.level=fd.get('level')||'easy';qd.order=+fd.get('order')||0;qd.timeLimit=Math.max(0,Math.min(300,+fd.get('tl')||0));
  qd.questions.forEach((q,i)=>{q.q=String(fd.get('q'+i)||'');q.opts=[0,1,2,3].map(j=>String(fd.get('o'+i+'_'+j)||''));const c=fd.get('c'+i);q.correct=c===null?-1:+c;q.explain=String(fd.get('e'+i)||'')});
}
const qRedraw=()=>{const b=$('#modal .sb');if(b)b.innerHTML=qBody()};
const blankQ=()=>({q:'',opts:['','','',''],correct:-1,explain:'',img:''});
function openTest(cid,iid){
  const it=iid?(S.items[cid]||{})[iid]:null;
  qd=it?Object.assign(clone(it),{cid,iid}):{cid,iid:'',title:'',level:'easy',order:itemsOf(cid).length+1,questions:[blankQ()]};
  qd.questions=(qd.questions&&qd.questions.length?qd.questions:[blankQ()]).map(q=>Object.assign(blankQ(),q));
  openModal((iid?t('edit'):t('add'))+': '+t('ty_test'),qBody(),`<button class="btn" type="submit" form="mf">${esc(t('save'))}</button>`);
}
function imgToData(file,max=900,q=.78){return new Promise((res,rej)=>{const fr=new FileReader();fr.onerror=rej;fr.onload=()=>{const im=new Image();im.onerror=rej;im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',q))};im.src=fr.result};fr.readAsDataURL(file)})}
CHG.qImg=async(v,el)=>{const f=el.files&&el.files[0];if(!f)return;qSync();try{qd.questions[+el.dataset.n].img=await imgToData(f)}catch(e){toast(t('imgErr'))}qRedraw()};
ACT.qImgDel=d=>{qSync();qd.questions[+d.n].img='';qRedraw()};
ACT.qAdd=()=>{qSync();qd.questions.push(blankQ());qRedraw()};
ACT.qDel=d=>{qSync();qd.questions.splice(+d.n,1);qRedraw()};
FORM.test=async()=>{
  qSync();const e=qd;
  if(!e.title.trim()){toast(t('required'));return}
  for(const q of e.questions){
    if(!q.q.trim()||q.opts.filter(o=>o.trim()).length<2||q.correct<0||!q.opts[q.correct]||!q.opts[q.correct].trim()){toast(t('needCorrect'));return}
  }
  if(JSON.stringify(e.questions).length>900000){toast(t('imgTooBig'));return}
  const iid=e.iid||uid();const old=clone(((S.items[e.cid]||{})[iid])||{});
  const doc=Object.assign(old,{type:'test',title:e.title.trim(),level:e.level,order:e.order,questions:e.questions.map(q=>({q:q.q.trim(),opts:q.opts.map(o=>o.trim()),correct:q.correct,explain:(q.explain||'').trim(),img:q.img||''})),timeLimit:e.timeLimit||0,created:old.created||Date.now()});
  const r=await W('set','courses/'+e.cid+'/items',iid,doc);
  if(r!==null){S.items[e.cid]=Object.assign(S.items[e.cid]||{},{[iid]:doc});await W('update','courses',e.cid,{counts:countsWith(e.cid,iid,'test')});closeModal();toast(t('saved'))}
};

ACT.annForm=()=>openModal(t('newAnn'),`<form id="mf" data-f="ann">${fld(t('title'),`<input type="text" name="title" required>`)}${fld(t('text'),`<textarea name="body" required rows="5"></textarea>`)}</form>`,`<button class="btn" type="submit" form="mf">${esc(t('send'))}</button>`);
FORM.ann=async fd=>{const r=await W('set','announcements',uid(),{title:String(fd.get('title')).trim(),body:String(fd.get('body')).trim(),ts:Date.now(),by:ME.login});if(r!==null){closeModal();toast(t('saved'))}};

ACT.doBackup=async()=>{
  const data={app:'physics-academy',version:VER,created:new Date().toISOString(),courses:S.courses,items:S.items,bundles:S.bundles,announcements:S.ann,settings:S.cfg,

/* ---- seed: 11 physics sections ---- */
ACT.seedPhysics=async()=>{
  if(!await confirmBox(t('seedConfirm'),t('create')))return;
  const T=[['kin','Кинематика','Кинематика'],['dyn','Динамика','Динамика'],['stat','Статика','Статика'],['work','Кор, тавоноӣ ва энергия','Работа, мощность и энергия'],['wave','Лапишҳо ва мавҷҳо','Колебания и волны'],['mol','Физикаи молекулавӣ','Молекулярная физика'],['thermo','Термодинамика','Термодинамика'],['elec','Электр','Электричество'],['magn','Магнетизм','Магнетизм'],['opt','Оптика','Оптика'],['atom','Физикаи атомӣ ва ядроӣ','Атомная и ядерная физика']];
  const zero={video:0,book:0,theory:0,test:0,problem:0};
  for(let i=0;i<T.length;i++){
    const [id,tg,ru]=T[i];
    await W('set','courses',id,{title:tg,titleRu:ru,desc:'',subjectId:'phys',icon:i,order:i+1,price:i===0?0:100,discount:0,free:i===0,popular:[0,1,7].includes(i),active:true,counts:Object.assign({},zero),created:Date.now()});
  }
  await W('set','bundles','full',{title:'Курси пурраи физика',price:900,discount:0,courseIds:T.map(x=>x[0]),active:true});
  const items={
    th1:{type:'theory',title:'Ҳаракати якрав',level:'easy',order:1,desc:'Мафҳумҳои асосӣ',body:'Ҳаракати якрав ҳаракатест, ки дар он ҷисм дар фосилаҳои баробари вақт роҳҳои баробар мегузарад. Суръат дар чунин ҳаракат тағйир намеёбад.',formulas:'v = s / t | Суръат = роҳ ÷ вақт\ns = v · t | Роҳи тайкарда',examples:'Автомобил бо суръати 20 м/с 5 сония ҳаракат кард. s = 20 · 5 = 100 м.',units:'Суръат: м/с\nРоҳ: м\nВақт: с',created:Date.now()},
    ts1:{type:'test',title:'Тести асосӣ: ҳаракати якрав',level:'easy',order:1,created:Date.now()-1,questions:[
      {q:'Суръати автомобил 20 м/с аст. Дар 5 сония чӣ қадар роҳ мегузарад?',opts:['50 м','100 м','25 м','4 м'],correct:1,explain:'s = v·t = 20·5 = 100 м'},
      {q:'Воҳиди ченаки суръат дар системаи SI кадом аст?',opts:['м/с','км/соат','м','с'],correct:0,explain:'Дар SI суръат бо метр бар сония ченида мешавад.'},
      {q:'Агар s = 60 м ва t = 12 с бошад, суръат чанд аст?',opts:['5 м/с','720 м/с','48 м/с','72 м/с'],correct:0,explain:'v = s / t = 60 / 12 = 5 м/с'}]},
    pr1:{type:'problem',title:'Масъалаи 1: суръати миёна',level:'medium',order:1,created:Date.now()-2,text:'Автомобил 150 км роҳро дар 2 соат тай кард. Суръати миёнаи онро ёбед (км/соат).',formulas:'v = s / t',steps:'Додашудаҳо: s = 150 км, t = 2 соат.\nФормулаи суръатро менависем: v = s / t.\nАрзишҳоро мегузорем: v = 150 / 2.\nҲисоб мекунем: v = 75.',answer:'75 км/соат',explain:'Суръати миёна ҳамеша ҳамчун тақсими роҳи умумӣ ба вақти умумӣ ҳисоб мешавад.'}

/* ================= boot ================= */
(async function boot(){
  applyTheme();render();
  if(window.FSX&&FSX.configured){
    DB=FSX.db;
    if(FSX.onBack)FSX.onBack(()=>{
      if(modalOpen()){closeModal();return}
      if(R.stack.length){goBack();return}
      if(R.v!==(isA()?'dash':'home')){goRoot(isA()?'dash':'home');return}
      if(FSX.exitApp)FSX.exitApp();
    });
    try{const init=await FSX.getDoc('config','init');needSetup=!init}catch(e){needSetup=false}
    FSX.onAuth(onAuthChanged);
    if(!FSX.native&&'serviceWorker' in navigator&&location.protocol==='https:'){try{navigator.serviceWorker.register('sw.js')}catch(e){}}
  }else{authReady=true}
  render();
})();
